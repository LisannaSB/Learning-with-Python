<!doctype html>
<html>
    <head>
        <title>Tablas</title>
    </head>
    <body>
        <table> <!--Tabla-->
            <thead> <!--Encabezado-->
                <tr> <!--Filas-->
                    <th>Mes</th> <!--Columna 1-->
                    <th>Ahorros</th> <!--Columna 2-->
                </tr>
            </thead>
            <tbody> <!--Contenido-->
                <tr>
                    <td>Enero</td> <!-- aqui es con td, no th-->
                    <td>1000$</td>
                </tr>
                <tr>
                    <td>Febrero</td> 
                    <td>500$</td>
                </tr>
            </tbody>
            <tfoot> <!--Pie de tabla-->
                <tr>
                    <td>Suma total:</td>
                    <td>1500$</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
